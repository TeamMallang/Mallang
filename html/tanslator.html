<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>말랑 — 번역기</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <div class="chat-page">
    <header class="t-header">
      <div class="t-logo-row">
        <img src="logo.png" class="logo-sm" alt="말랑">
      </div>
      <div class="t-right">
        <div class="desk-f">
          <div class="nsel-wrap">
            <select class="nsel" id="h-region"><option value="">지역 선택</option></select>
            <span class="nsel-arr">▾</span>
          </div>
          <div class="nsel-wrap">
            <select class="nsel" id="h-job"><option value="">직종 선택</option></select>
            <span class="nsel-arr">▾</span>
          </div>
        </div>
        <button class="new-btn" id="btn-new">＋ <span id="nc-lbl">새 채팅</span></button>
        <div class="prof-wrap">
          <button class="prof-btn cl" id="prof-btn">
            <div class="prof-av">👤</div>
            <span class="prof-name">김신입</span>
            <span class="prof-arr">▾</span>
          </button>
          <div class="prof-dd" id="prof-dd">
            <div class="dd-head">
              <div class="dd-av">👤</div>
              <div>
                <div class="dd-name">김신입</div>
                <div class="dd-email">shin.ip@company.com</div>
              </div>
            </div>
            <div class="dd-hr"></div>
            <div style="padding:4px 0">
              <button class="dd-item"><span class="dd-icon">🔑</span>암호 변경</button>
              <button class="dd-item"><span class="dd-icon">⚙️</span>프로필 변경</button>
            </div>
            <div class="dd-hr-m"></div>
            <div class="dd-sect">테마</div>
            <div class="theme-row">
              <button class="theme-btn" id="btn-light">☀️ 라이트</button>
              <button class="theme-btn" id="btn-dark">🌙 다크</button>
            </div>
            <div class="dd-hr-m"></div>
            <div class="dd-sect">최근 대화</div>
            <div class="conv-list" id="conv-list"></div>
            <div class="dd-hr-m"></div>
            <div style="padding:4px 0">
              <button class="dd-item danger" id="btn-logout">
                <span class="dd-icon">🚪</span>로그아웃
              </button>
            </div>
          </div>
        </div>
      </div>
    </header>

    <div class="mob-filters">
      <div class="nsel-wrap" style="flex:1">
        <select class="nsel" id="m-region"><option value="">지역</option></select>
        <span class="nsel-arr">▾</span>
      </div>
      <div class="nsel-wrap" style="flex:1">
        <select class="nsel" id="m-job"><option value="">직종</option></select>
        <span class="nsel-arr">▾</span>
      </div>
    </div>

    <div class="chat-area" id="chat-area">
      <div class="chat-inner" id="chat-inner"></div>
    </div>

    <div class="input-area">
      <div class="input-inner">
        <div class="chip-row" id="chip-row">
          <button class="chip">이거 왜 저한테 시키는 거예요?</button>
          <button class="chip">그 일은 제 담당이 아닌데요</button>
          <button class="chip">오늘 일찍 퇴근해도 되나요?</button>
          <button class="chip">그 회의 꼭 참석해야 하나요?</button>
        </div>
        <div class="input-box">
          <textarea class="chat-ta" id="chat-ta" rows="1"
            placeholder="솔직하게 하고 싶은 말을 입력하세요… (Enter 전송, Shift+Enter 줄바꿈)"></textarea>
          <button class="send-btn" id="btn-send" disabled>➤</button>
        </div>
        <p class="input-note">대화 내용은 저장되지 않으며 세션 종료 시 즉각 폐기됩니다.</p>
      </div>
    </div>
  </div>

  <script src="../app.js"></script>
  <script>
    initTheme();
    initBounce();
    initProfileDropdown();
    initChat();
    initResize();
    renderChat();
    renderConvs();
  </script>
</body>
</html>
