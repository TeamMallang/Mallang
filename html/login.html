<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>말랑 — 사회 언어 번역기 (로그인)</title>
<link rel="stylesheet" href="../styles.css">
</head>
<body>
<div id="mallang-root">
<div id="page-login" class="page active auth-layout">
  <div class="auth-left">
    <div class="auth-grid"></div>
    <div class="auth-blob" style="bottom:-96px;right:-96px;width:320px;height:320px;background:radial-gradient(circle,rgba(64,112,244,.18) 0%,transparent 70%)"></div>
    <div class="auth-blob" style="top:64px;right:-64px;width:224px;height:224px;background:radial-gradient(circle,rgba(64,112,244,.10) 0%,transparent 70%)"></div>
    <div class="brand-row"><svg width="32" height="32" viewBox="0 0 40 40" fill="none">
  <rect width="40" height="40" rx="15" fill="#1A2750"/>
  <circle cx="30" cy="30" r="9" fill="#4070F4" opacity=".22"/>
  <circle cx="30" cy="30" r="5.5" fill="#4070F4" opacity=".35"/>
  <text x="5" y="28" font-family="'Plus Jakarta Sans',sans-serif" font-weight="800" font-size="22" fill="white">M</text>
</svg> <span class="brand-name-sm">말랑</span></div>
    <div style="position:relative;z-index:1">
      <p class="left-label">Welcome</p>
      <h1 class="left-heading">그 말,<br>말랑하게<br>다시 해볼까요?</h1>
      <p class="left-sub">사회 경험이 적은 직장인을 위한 코칭 AI.<br>내 말을 부드럽고 전문적인 언어로 바꿔드립니다.</p>
    </div>
    <p class="left-footer" style="position:relative;z-index:1">© 2025 Team Mallang</p>
  </div>
  <div class="auth-right">
    <div class="auth-form-wrap">
      <h2 class="form-title">다시 만나서 반가워요</h2>
      <p class="form-sub">로그인하고 말랑하게 시작해봐요.</p>
      <div class="field"><label class="field-label">이메일</label><input type="email" class="field-input" placeholder="name@company.com"></div>
      <div class="field"><label class="field-label">비밀번호</label><input type="password" class="field-input" placeholder="••••••••"></div>
      <button class="forgot-btn">비밀번호를 잊으셨나요?</button>
      <button class="btn-primary mallang-btn" id="login-btn">로그인 →</button>
      <div class="divider"><div class="divider-line"></div><span class="divider-text">또는</span><div class="divider-line"></div></div>
      <p class="signup-row">아직 계정이 없으신가요? <button class="signup-row-btn mallang-btn" id="go-signup-btn">회원가입</button></p>
    </div>
  </div>
</div>
</div>
<script src="../app.js"></script>
</body>
</html>
