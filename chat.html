<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>말랑 — 사회 언어 번역기 (번역기)</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="mallang-root">
<div id="page-translator" class="page active">
  <header class="t-header">
    <div class="t-logo-row">
      <svg width="30" height="30" viewBox="0 0 40 40" fill="none">
  <rect width="40" height="40" rx="15" fill="#1A2750"/>
  <circle cx="30" cy="30" r="9" fill="#4070F4" opacity=".22"/>
  <circle cx="30" cy="30" r="5.5" fill="#4070F4" opacity=".35"/>
  <text x="5" y="28" font-family="'Plus Jakarta Sans',sans-serif" font-weight="800" font-size="22" fill="white">M</text>
</svg>
      <span class="t-brand" id="t-brand">말랑</span>
    </div>
    <div class="t-right">
      <div class="desk-filters" style="display:flex;gap:8px;align-items:center">
        <div class="nsel-wrap"><select class="nsel" id="h-region"><option value="">지역 선택</option></select><span class="nsel-arr">▾</span></div>
        <div class="nsel-wrap"><select class="nsel" id="h-job"><option value="">직종 선택</option></select><span class="nsel-arr">▾</span></div>
      </div>
      <button class="new-chat-btn mallang-btn" id="new-chat-btn">＋ <span id="nc-label">새 채팅</span></button>
      <div class="prof-wrap">
        <button class="prof-btn closed mallang-btn" id="prof-btn">
          <div class="prof-av">👤</div>
          <span class="prof-name">김신입</span>
          <span class="prof-arr">▾</span>
        </button>
        <div class="prof-dropdown" id="prof-dropdown">
          <div class="pd-head"><div class="pd-av">👤</div><div><div class="pd-name">김신입</div><div class="pd-email">shin.ip@company.com</div></div></div>
          <div class="pd-hr"></div>
          <div style="padding:4px 0">
            <button class="pd-item"><span class="pd-icon">🔑</span>암호 변경</button>
            <button class="pd-item"><span class="pd-icon">⚙️</span>프로필 변경</button>
          </div>
          <div class="pd-hr-mx"></div>
          <div style="padding:4px 0">
            <div class="pd-sect">최근 대화</div>
            <div class="pd-conv-list" id="conv-list"></div>
          </div>
          <div class="pd-hr-mx"></div>
          <div style="padding:4px 0">
            <button class="pd-item danger" id="logout-btn"><span class="pd-icon">🚪</span>로그아웃</button>
          </div>
        </div>
      </div>
    </div>
  </header>
  <div class="mob-filters">
    <div class="nsel-wrap" style="flex:1"><select class="nsel" id="m-region"><option value="">지역</option></select><span class="nsel-arr">▾</span></div>
    <div class="nsel-wrap" style="flex:1"><select class="nsel" id="m-job"><option value="">직종</option></select><span class="nsel-arr">▾</span></div>
  </div>
  <div class="chat-area" id="chat-area"><div class="chat-inner" id="chat-inner"></div></div>
  <div class="input-area">
    <div class="input-inner">
      <div class="chip-row" id="chip-row">
        <button class="chip mallang-btn">이거 왜 저한테 시키는 거예요?</button>
        <button class="chip mallang-btn">그 일은 제 담당이 아닌데요</button>
        <button class="chip mallang-btn">오늘 일찍 퇴근해도 되나요?</button>
        <button class="chip mallang-btn">그 회의 꼭 참석해야 하나요?</button>
      </div>
      <div class="input-box">
        <textarea class="chat-ta" id="chat-ta" rows="1" placeholder="솔직하게 하고 싶은 말을 입력하세요… (Enter 전송, Shift+Enter 줄바꿈)"></textarea>
        <button class="send-btn mallang-btn" id="send-btn" disabled>➤</button>
      </div>
      <p class="input-note">대화 내용은 저장되지 않으며 세션 종료 시 즉각 폐기됩니다.</p>
    </div>
  </div>
</div>
</div>
<script src="app.js"></script>
</body>
</html>
